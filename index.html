<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Crowd Choice Battle</title>
<link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUI0c0zefydxcFxRffYh0e9NLbfMnzI8EtzA&s" sizes="16×16" type="image/png" /> 
<style>
body{margin:0;overflow:hidden;font-family:Arial;}
canvas{display:block;}
#ui{
 position:absolute;
 top:10px;
 left:50%;
 transform:translateX(-50%);
 color:white;
 font-weight:bold;
 text-align:center;
 text-shadow:0 0 5px black;
}
#retryBtn{
 position:absolute;
 top:55%;
 left:50%;
 transform:translate(-50%,-50%);
 padding:12px 24px;
 font-size:20px;
 display:none;
}
</style>
</head>
<body>

<div id="ui"></div>
<button id="retryBtn">リトライ</button>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

/* ===== 永続データ ===== */
let save=JSON.parse(localStorage.getItem("crowdSaveCloud"))||{
 startLv:0
};
function saveData(){
 localStorage.setItem("crowdSaveCloud",JSON.stringify(save));
}
function getBaseCrowd(){return 10+save.startLv*5;}

/* ===== ゲーム変数 ===== */
let crowd=getBaseCrowd();
let level=1;
let combo=0;
let panelCount=0;
let state="panel";
let frame=0;
let fightTimer=0;

let panelTimer=0;
let panelLimit=240;
let panelY=0;

let currentPanels=[];
let currentEnemy=null;
let effects=[];
let flash=0;

/* ===== 雲データ ===== */
let cloudsFar=[];
let cloudsNear=[];

function createCloud(y,scale){
 return{
  x:Math.random()*canvas.width,
  y:y,
  size:80*scale+Math.random()*40,
  speed:0.3*scale+Math.random()*0.3
 };
}

for(let i=0;i<8;i++){
 cloudsFar.push(createCloud(Math.random()*canvas.height,0.8));
}
for(let i=0;i<6;i++){
 cloudsNear.push(createCloud(Math.random()*canvas.height,1.4));
}

/* ===== 背景描画 ===== */
function drawBackground(){

 let grad=ctx.createLinearGradient(0,0,0,canvas.height);
 grad.addColorStop(0,"#6ec6ff");
 grad.addColorStop(1,"#c9f0ff");
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,canvas.width,canvas.height);

 function drawCloud(c,alpha){
  ctx.globalAlpha=alpha;
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(c.x,c.y,c.size*0.6,0,Math.PI*2);
  ctx.arc(c.x+c.size*0.6,c.y+10,c.size*0.5,0,Math.PI*2);
  ctx.arc(c.x-c.size*0.6,c.y+10,c.size*0.5,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
 }

 cloudsFar.forEach(c=>{
  c.y+=c.speed+level*0.05;
  if(c.y>canvas.height+100){
   c.y=-100;
   c.x=Math.random()*canvas.width;
  }
  drawCloud(c,0.5);
 });

 cloudsNear.forEach(c=>{
  c.y+=c.speed+level*0.1;
  if(c.y>canvas.height+150){
   c.y=-150;
   c.x=Math.random()*canvas.width;
  }
  drawCloud(c,0.9);
 });
}

/* ===== パネル生成 ===== */
function newSet(){
 let types=["+5","-3","×2","÷2"];
 if(level>=5) types.push("+10");
 if(level>=8) types.push("×3");
 if(level>=12) types.push("-10");

 currentPanels=[
  {x:canvas.width*0.3,type:types[Math.floor(Math.random()*types.length)]},
  {x:canvas.width*0.7,type:types[Math.floor(Math.random()*types.length)]}
 ];

 panelTimer=panelLimit - level*5;
 panelY=-80;
 state="panel";
}

function spawnEnemy(){
 currentEnemy={
  power:Math.floor(Math.random()*20)+10+level*6
 };
 state="enemy";
}

newSet();

/* ===== パネル処理 ===== */
function applyPanel(type){
 if(type==="+5") crowd+=5;
 if(type==="-3") crowd=Math.max(0,crowd-3);
 if(type==="×2") crowd*=2;
 if(type==="÷2") crowd=Math.floor(crowd/2);
 if(type==="+10") crowd+=10;
 if(type==="×3") crowd*=3;
 if(type==="-10") crowd=Math.max(0,crowd-10);
}

function choosePanel(choiceX){
 let chosen=currentPanels.reduce((a,b)=>
  Math.abs(b.x-choiceX)<Math.abs(a.x-choiceX)?b:a
 );
 applyPanel(chosen.type);

 panelCount++;

 if(panelCount>=3){
  panelCount=0;
  spawnEnemy();
 }else{
  newSet();
 }
}

/* ===== 戦闘 ===== */
function fight(){
 fightTimer--;
 if(fightTimer>0) return;

 if(crowd>currentEnemy.power){
  crowd-=currentEnemy.power;
  combo++;
  level++;
  flash=10;

  effects.push({
   x:canvas.width/2,
   y:150,
   r:10,
   life:30
  });

  newSet();
 }else{
  state="over";
  combo=0;

  if(level>save.startLv){
   save.startLv=level;
   saveData();
  }

  document.getElementById("retryBtn").style.display="block";
 }
}

/* ===== 群衆描画 ===== */
function drawPerson(x,y,size){
 const leg=Math.sin(frame*0.3)*4;
 ctx.fillStyle="#0077ff";
 ctx.fillRect(x,y,size,size);
 ctx.fillRect(x,y+size,size/3,size/2+leg);
 ctx.fillRect(x+size*0.7,y+size,size/3,size/2-leg);
}

function drawCrowd(){
 const playerY=canvas.height-120;
 const rows=Math.ceil(Math.sqrt(crowd));
 const size=10;
 let count=0;

 for(let y=0;y<rows;y++){
  for(let x=0;x<rows;x++){
   if(count>=crowd)return;
   drawPerson(
    canvas.width/2+(x-rows/2)*size*1.8,
    playerY+(y-rows/2)*size*1.8,
    size
   );
   count++;
  }
 }
}

/* ===== メイン描画 ===== */
function draw(){
 drawBackground();
 frame++;

 if(flash>0){
  ctx.fillStyle="rgba(255,255,255,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  flash--;
 }

 drawCrowd();

 if(state==="panel"){

  panelTimer--;
  panelY+=3+level*0.3;

  currentPanels.forEach(p=>{
   ctx.fillStyle="#0044aa";
   ctx.fillRect(p.x-90,panelY,180,70);
   ctx.fillStyle="white";
   ctx.textAlign="center";
   ctx.font="26px Arial";
   ctx.fillText(p.type,p.x,panelY+45);
  });

  ctx.fillStyle="gray";
  ctx.fillRect(50,50,canvas.width-100,15);
  ctx.fillStyle="lime";
  ctx.fillRect(50,50,(canvas.width-100)*(panelTimer/panelLimit),15);

  if(panelTimer<=0 || panelY>canvas.height-200){
   let random=currentPanels[Math.floor(Math.random()*2)];
   applyPanel(random.type);
   panelCount++;

   if(panelCount>=3){
    panelCount=0;
    spawnEnemy();
   }else{
    newSet();
   }
  }

  ctx.fillStyle="white";
  ctx.fillText(`パネル ${panelCount+1}/3`,canvas.width/2,100);
 }

 if(state==="enemy"){
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(canvas.width/2,150,60+level*2,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="26px Arial";
  ctx.fillText("敵出現！タップで戦闘",canvas.width/2,90);
  ctx.fillText(currentEnemy.power,canvas.width/2,160);
 }

 if(state==="fight") fight();

 if(state==="over"){
  ctx.fillStyle="black";
  ctx.font="42px Arial";
  ctx.textAlign="center";
  ctx.fillText("GAME OVER",canvas.width/2,canvas.height/2-40);
 }

 document.getElementById("ui").textContent=
  `人数:${crowd} | Lv:${level} | Combo:${combo} | 強化:${save.startLv}`;
}

function loop(){draw();requestAnimationFrame(loop);}
loop();

/* ===== 入力 ===== */
addEventListener("mousedown",e=>{
 if(state==="panel") choosePanel(e.clientX);
 else if(state==="enemy"){
  state="fight";
  fightTimer=60;
 }
});

addEventListener("touchstart",e=>{
 if(state==="panel") choosePanel(e.touches[0].clientX);
 else if(state==="enemy"){
  state="fight";
  fightTimer=60;
 }
});

document.getElementById("retryBtn").onclick=()=>{
 crowd=getBaseCrowd();
 level=1;
 combo=0;
 panelCount=0;
 state="panel";
 document.getElementById("retryBtn").style.display="none";
 newSet();
};
</script>
</body>
</html>
